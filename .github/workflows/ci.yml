name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, changed tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # pr_tests.py diffs against the base branch, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # D-0136: only the tests this change touches, stopped at 60 s. The
      # whole suite runs in scripts/release.py; the three-OS matrix runs on main and v* tags.
      - name: Tests this change touches
        if: github.event_name == 'pull_request'
        run: python3 scripts/pr_tests.py --base origin/${{ github.base_ref }}
      - name: Tests the last commit touches
        if: github.event_name != 'pull_request'
        run: python3 scripts/pr_tests.py --base HEAD~1
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    # D-0136: not on pull requests. On main it keeps the macOS 15 build/boot coverage
    # tests/desktop-platform.test.ts requires; release.yml runs the same steps on a v* tag.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
